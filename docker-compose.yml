services:
  postgres:
    image: postgres:16
    container_name: maliagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maliagent
      POSTGRES_PASSWORD: maliagent
      POSTGRES_DB: maliagent
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maliagent -d maliagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maliagent-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # En conteneur, l'hôte PostgreSQL est le nom du service Docker
      DATABASE_URL: postgresql+psycopg://maliagent:maliagent@postgres:5432/maliagent
    ports:
      - "8000:8000"
    volumes:
      - ./storage/invoices:/app/storage/invoices

volumes:
  postgres-data:
