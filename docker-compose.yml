services:
  postgres:
    image: postgres:16
    container_name: maliagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maliagent
      POSTGRES_PASSWORD: maliagent
      POSTGRES_DB: maliagent
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
